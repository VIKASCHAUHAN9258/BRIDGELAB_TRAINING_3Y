<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel Agency</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="travel_agency_showcase.css"></head>
<body><header class="py-3 bg-dark text-white text-center"><h1 class="h3 mb-0">WanderWorld Travel</h1></header>
<main class="container py-4"><div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
<div class="carousel-inner"><div class="carousel-item active" data-bs-interval="2500"><div class="destination">GOA</div><div class="carousel-caption"><h2>Goa</h2><p>Sun, beaches and unforgettable evenings.</p></div></div><div class="carousel-item" data-bs-interval="3500"><div class="destination second">MANALI</div><div class="carousel-caption"><h2>Manali</h2><p>Mountains, adventure and peaceful valleys.</p></div></div><div class="carousel-item" data-bs-interval="4500"><div class="destination third">JAIPUR</div><div class="carousel-caption"><h2>Jaipur</h2><p>Heritage, culture and royal architecture.</p></div></div></div>
<button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button><button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button></div>
<section class="mt-5"><div class="d-flex justify-content-between"><h2 class="h5">Booking Completion</h2><span>70%</span></div><div class="progress"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:70%">70%</div></div></section></main>
<footer class="text-center py-4 bg-dark text-white">Contact: travel@wanderworld.example | +91 98765 43210</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>

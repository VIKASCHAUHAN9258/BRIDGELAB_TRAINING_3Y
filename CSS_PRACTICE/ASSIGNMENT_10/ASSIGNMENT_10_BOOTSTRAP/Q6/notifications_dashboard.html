<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="notifications_dashboard.css"></head>
<body><main class="container py-5"><h1 class="text-center mb-4">Notifications Dashboard</h1><section class="card shadow-sm"><div class="card-body"><div class="alert alert-success" role="alert"><strong>Success:</strong> Your profile was updated.</div><div class="alert alert-info" role="alert"><strong>Tip:</strong> Enable two-factor authentication.</div><div class="alert alert-danger alert-dismissible fade show" role="alert"><strong>Warning:</strong> New login detected from an unknown device.<button type="button" class="btn-close" aria-label="Close"></button></div><section class="bg-light border rounded p-4 mt-4"><h2 class="h5">Summary</h2><p class="mb-0">3 notifications require your attention today.</p></section></div></section></main></body></html>

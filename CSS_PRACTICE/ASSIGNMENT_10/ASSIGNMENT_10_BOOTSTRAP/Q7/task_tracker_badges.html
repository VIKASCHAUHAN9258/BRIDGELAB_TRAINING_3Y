<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="task_tracker_badges.css"></head>
<body><main class="container py-5"><header class="d-flex justify-content-between align-items-center mb-4"><h1 class="mb-0">Task Tracker</h1><span class="badge text-bg-danger fs-6">3 Pending</span></header>
<div class="list-group shadow-sm"><div class="list-group-item d-flex justify-content-between align-items-center">Complete security report <span class="badge text-bg-danger">High</span></div><div class="list-group-item d-flex justify-content-between align-items-center">Review project code <span class="badge text-bg-warning">Medium</span></div><div class="list-group-item d-flex justify-content-between align-items-center">Update documentation <span class="badge text-bg-success">Low</span></div></div>
<button class="btn btn-primary mt-4">Completed <span class="badge text-bg-light text-dark">8</span></button></main></body></html>

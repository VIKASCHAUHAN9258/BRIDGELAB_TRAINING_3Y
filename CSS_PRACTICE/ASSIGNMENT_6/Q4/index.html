<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header><h1>Security Dashboard</h1></header>

        <aside>
            <h2>Menu</h2>
            <a href="#">Dashboard</a>
            <a href="#">Alerts</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
        </aside>

        <main class="content">
            <section class="box wide"><h2>Security Overview</h2><p>System status and overall risk information.</p></section>
            <section class="box"><h2>Alerts</h2><p>12 active alerts</p></section>
            <section class="box"><h2>Users</h2><p>248 monitored users</p></section>
            <section class="box"><h2>Logs</h2><p>1,420 events today</p></section>
        </main>
    </div>
</body>
</html>

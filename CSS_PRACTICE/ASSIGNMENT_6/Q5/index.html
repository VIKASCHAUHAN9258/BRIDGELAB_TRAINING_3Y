<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Choose Your Plan</h1>
        <section class="pricing">
            <article class="card">
                <h2>Basic</h2><p class="price">₹499</p>
                <p>Essential features</p><p>Email support</p><button>Choose Plan</button>
            </article>
            <article class="card featured">
                <h2>Pro</h2><p class="price">₹999</p>
                <p>All basic features</p><p>Priority support</p><button>Choose Plan</button>
            </article>
            <article class="card">
                <h2>Premium</h2><p class="price">₹1,499</p>
                <p>Advanced features</p><p>24/7 support</p><button>Choose Plan</button>
            </article>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Photo Gallery</h1>
    <main class="gallery">
        <figure><div class="photo photo1" role="img" aria-label="Mountain landscape"></div><figcaption>Mountain Escape</figcaption></figure>
        <figure><div class="photo photo2" role="img" aria-label="Ocean landscape"></div><figcaption>Ocean View</figcaption></figure>
        <figure><div class="photo photo3" role="img" aria-label="Forest landscape"></div><figcaption>Forest Trail</figcaption></figure>
        <figure><div class="photo photo4" role="img" aria-label="City landscape"></div><figcaption>City Lights</figcaption></figure>
        <figure><div class="photo photo5" role="img" aria-label="Desert landscape"></div><figcaption>Desert Road</figcaption></figure>
        <figure><div class="photo photo6" role="img" aria-label="Lake landscape"></div><figcaption>Calm Lake</figcaption></figure>
    </main>
</body>
</html>

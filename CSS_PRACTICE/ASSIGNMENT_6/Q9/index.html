<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="scene">
        <div class="card">
            <div class="face front">
                <div class="card-image">CYBER</div>
                <h2>Cybersecurity</h2>
            </div>
            <div class="face back">
                <h2>About the Card</h2>
                <p>Cybersecurity focuses on protecting systems, networks and information from digital threats.</p>
            </div>
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="layout">
        <div class="box px"><h2>Pixels</h2><p>Width: 220px<br>Height: 150px</p></div>
        <div class="box percent"><h2>Percentage</h2><p>Width: 35%<br>min-height applied</p></div>
        <div class="box vh"><h2>Viewport</h2><p>Height: 25vh<br>max-width applied</p></div>
        <div class="box em"><h2>EM</h2><p>Width: 18em<br>Overflow is controlled.</p></div>
    </main>
</body>
</html>

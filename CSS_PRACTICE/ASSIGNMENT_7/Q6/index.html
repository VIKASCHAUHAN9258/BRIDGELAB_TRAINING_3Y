<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>CSS Transformations Showcase</h1>
        <section class="showcase">
            <div><div class="transform rotate">Rotate</div><p>rotate()</p></div>
            <div><div class="transform scale">Scale</div><p>scale()</p></div>
            <div><div class="transform translate">Move</div><p>translate()</p></div>
            <div><div class="transform skew">Skew</div><p>skew()</p></div>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Classes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Pseudo-Classes Demonstration</h1>
        <section class="examples">
            <article><a href="#">Hover Link</a><p><strong>:hover</strong> changes the link when the pointer is over it.</p></article>
            <article><button>Focus Button</button><p><strong>:focus</strong> highlights a focused button.</p></article>
            <article><button class="active-demo">Active Button</button><p><strong>:active</strong> changes the button while it is being pressed.</p></article>
            <article><ul><li>Item One</li><li>Item Two</li><li>Item Three</li></ul><p><strong>:nth-child()</strong> targets an item by its position.</p></article>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <header><h1>TechPanel</h1><nav><a href="#">Home</a><a href="#">Dashboard</a><a href="#">Profile</a></nav></header>
        <main>
            <section class="card">
                <div class="visual" role="img" aria-label="Technology illustration">TECH</div>
                <div class="content">
                    <h2>Welcome Back</h2>
                    <p>Enter your details to continue.</p>
                    <form>
                        <label for="email">Email</label>
                        <input id="email" type="email" placeholder="you@example.com">
                        <label for="password">Password</label>
                        <input id="password" type="password" placeholder="Password">
                        <button type="submit">Sign In</button>
                    </form>
                </div>
            </section>
        </main>
        <footer>© 2026 TechPanel</footer>
    </div>
</body>
</html>

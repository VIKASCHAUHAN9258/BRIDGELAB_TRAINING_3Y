<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Image Showcase</h1>
        <section class="gallery">
            <figure><div class="image-wrap"><img src="images/mountains.svg" alt="Mountains"></div><figcaption>Mountain View</figcaption></figure>
            <figure><div class="image-wrap"><img src="images/ocean.svg" alt="Ocean"></div><figcaption>Ocean Escape</figcaption></figure>
            <figure><div class="image-wrap"><img src="images/forest.svg" alt="Forest"></div><figcaption>Forest Trail</figcaption></figure>
            <figure><div class="image-wrap"><img src="images/city.svg" alt="City"></div><figcaption>City Lights</figcaption></figure>
            <figure><div class="image-wrap"><img src="images/desert.svg" alt="Desert"></div><figcaption>Desert Road</figcaption></figure>
            <figure><div class="image-wrap"><img src="images/lake.svg" alt="Lake"></div><figcaption>Calm Lake</figcaption></figure>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>CSS Selectors Practice</h1></header>
    <main>
        <p class="intro">This paragraph demonstrates element and class selectors.</p>
        <p id="special">This paragraph demonstrates an ID selector.</p>
        <a href="https://example.com">Attribute selector link</a>
        <section class="parent">
            <p>Descendant paragraph</p>
            <ul><li>Direct child item</li><li>Another item</li></ul>
            <p>Paragraph after the list</p>
            <p>Another sibling paragraph</p>
        </section>
    </main>
    <footer>© 2026 Selector Practice</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive_image_filter_gallery.css">
</head>
<body>
    <main>
        <h1>Responsive Image Filter Gallery</h1>
        <section class="gallery">
            <figure class="blur"><img src="images/mountains.svg" alt="Mountains"><figcaption>Blur Filter</figcaption></figure>
            <figure class="grayscale"><img src="images/ocean.svg" alt="Ocean"><figcaption>Grayscale Filter</figcaption></figure>
            <figure class="sepia"><img src="images/forest.svg" alt="Forest"><figcaption>Sepia Filter</figcaption></figure>
            <figure class="brightness"><img src="images/city.svg" alt="City"><figcaption>Brightness Filter</figcaption></figure>
            <figure class="contrast"><img src="images/desert.svg" alt="Desert"><figcaption>Contrast Filter</figcaption></figure>
            <figure class="hue"><img src="images/lake.svg" alt="Lake"><figcaption>Hue-Rotate Filter</figcaption></figure>
        </section>
    </main>
</body>
</html>

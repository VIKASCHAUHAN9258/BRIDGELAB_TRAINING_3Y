<!DOCTYPE html>
<html>
<head>
    <title>Form Security</title>
</head>
<body>

    <h1>Secure Form</h1>

    <form autocomplete="off">
        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username"
            required>
        <br><br>

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            required>
        <br><br>

        <input type="submit" value="Submit">
    </form>

    <p>
        Turning off autocomplete can improve security by preventing the browser
        from automatically storing or filling sensitive form information.
    </p>

</body>
</html>

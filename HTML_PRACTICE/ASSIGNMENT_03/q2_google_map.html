<!DOCTYPE html>
<html>
<head>
    <title>Google Map</title>
</head>
<body>

    <h1>My City</h1>

    <!-- The loading="lazy" attribute loads the iframe only when it is needed. -->
    <iframe
        src="https://www.google.com/maps?q=Greater+Noida&output=embed"
        width="600"
        height="450"
        title="Google Map of Greater Noida"
        loading="lazy">
    </iframe>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Span Elements</title>
</head>
<body>
    <!-- Three span elements label different parts of the text -->
    <p>
        <span>Cybersecurity</span> is my domain,
        <span>Python</span> is a useful programming skill,
        and <span>Linux</span> is an important operating system for my learning.
    </p>
</body>
</html>

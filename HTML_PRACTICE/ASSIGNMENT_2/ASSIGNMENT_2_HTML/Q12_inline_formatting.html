<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline Formatting</title>
</head>
<body>
    <!-- Multiple inline elements in one paragraph -->
    <p>
        <strong>Learning</strong> cybersecurity requires <em>consistent practice</em>.
        <mark>Keep experimenting</mark> and stay curious.
        <small>Progress takes time.</small><br>
        Every small step builds a stronger foundation.
    </p>
</body>
</html>

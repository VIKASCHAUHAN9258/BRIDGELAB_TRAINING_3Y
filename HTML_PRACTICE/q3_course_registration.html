<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q3 - Course Registration Form</title>
</head>
<body>

    <header>
        <h1>Course Registration</h1>
    </header>

    <main>
        <form action="#" method="post">

            <!-- Fieldset for personal details -->
            <fieldset>
                <legend>Personal Details</legend>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
            </fieldset>

            <br>

            <!-- Fieldset for course selection -->
            <fieldset>
                <legend>Course Selection</legend>

                <label for="course">Select Course:</label>
                <select id="course" name="course">
                    <option value="cs">Computer Science</option>
                    <option value="cyber">Cybersecurity</option>
                    <option value="ds">Data Science</option>
                    <option value="ai">Artificial Intelligence</option>
                </select>
            </fieldset>

            <br>

            <input type="submit" value="Register">
        </form>

        <!-- Course Schedule Table -->
        <h2>Available Course Schedules</h2>
        <table border="1">
            <tr>
                <th>Day</th>
                <th>Time</th>
                <th>Instructor</th>
            </tr>
            <tr>
                <td>Monday</td>
                <td>10:00 AM - 12:00 PM</td>
                <td>Dr. Sharma</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>2:00 PM - 4:00 PM</td>
                <td>Prof. Verma</td>
            </tr>
            <tr>
                <td>Friday</td>
                <td>11:00 AM - 1:00 PM</td>
                <td>Dr. Gupta</td>
            </tr>
        </table>
    </main>

    <footer>
        <p>&copy; 2026 GLA University Course Portal.</p>
    </footer>

</body>
</html>

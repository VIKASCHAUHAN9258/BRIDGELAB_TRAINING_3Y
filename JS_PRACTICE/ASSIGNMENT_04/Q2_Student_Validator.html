<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Validator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; }
        label { display: block; margin-top: 14px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 5px; border: 2px solid #aaa; border-radius: 5px; }
        input.valid { border-color: #16803c; }
        input.invalid { border-color: #d22; }
        .error { color: #c00; font-size: 13px; min-height: 16px; }
        button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
        #result { margin-top: 14px; }
    </style>
</head>
<body>
    <h2>Student Registration Form</h2>
    <form id="studentForm" novalidate>
        <label for="name">Name</label>
        <input id="name" type="text">
        <div class="error" id="nameError"></div>

        <label for="email">Email</label>
        <input id="email" type="text">
        <div class="error" id="emailError"></div>

        <label for="phone">Phone</label>
        <input id="phone" type="text" inputmode="numeric">
        <div class="error" id="phoneError"></div>

        <label for="password">Password</label>
        <input id="password" type="password">
        <div class="error" id="passwordError"></div>

        <button type="submit">Register</button>
        <p id="result" aria-live="polite"></p>
    </form>
    <script src="Q2_Student_Validator.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; }
        label { display: block; margin-top: 14px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 5px; }
        button { margin-top: 18px; padding: 10px 18px; }
        #ticket { margin-top: 20px; padding: 14px; background: #f2f2f2; }
        .error { color: #c00; }
    </style>
</head>
<body>
    <h2>Movie Ticket Booking</h2>
    <form id="bookingForm" novalidate>
        <label for="bookingName">Name</label>
        <input id="bookingName" type="text">
        <label for="bookingEmail">Email</label>
        <input id="bookingEmail" type="text">
        <label for="seats">Seats (1–10)</label>
        <input id="seats" type="number" min="1" max="10">
        <button type="submit">Book Tickets</button>
        <p id="bookingMessage" aria-live="polite"></p>
    </form>
    <div id="ticket"></div>
    <script src="Q5_Movie_Ticket_Booking.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Object Updater</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; }
        label { display: block; margin-top: 14px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 5px; }
        button { margin-top: 18px; padding: 10px 18px; }
        pre { background: #f2f2f2; padding: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Edit User Details</h2>
    <form id="userForm">
        <label for="userName">Name</label>
        <input id="userName" type="text" required>
        <label for="userEmail">Email</label>
        <input id="userEmail" type="email" required>
        <label for="userAge">Age</label>
        <input id="userAge" type="number" min="1" required>
        <button type="submit">Update User</button>
    </form>
    <h3>Updated User Object</h3>
    <pre id="userOutput"></pre>
    <script src="Q8_Dynamic_Object_Updater.js"></script>
</body>
</html>
